</style></head><body><main><header><small>⚡ CAMERA READY • JUNE 2027</small><h1>PROJECT THOR · PHASE 1</h1><div>Full muscles · Smaller waist · Strength preserved</div></header><nav id="nav"></nav><div id="storage-alert" class="danger" role="alert"></div><div id="root">Loading Project Thor…</div><small>⚡ Autosave works in this browser only. Cloud is currently inactive. Export JSON backups regularly to protect your private records.</small></main>

<script>
"use strict";
const EX=[
["Chest + Back A",[["Barbell bench press",3,"6–8"],["Lat pulldown",3,"6–10"],["Incline barbell press",2,"8–10"],["Chest-supported row",3,"8–12"],["High-to-low cable fly",2,"12–15"],["Cable lateral raise",2,"12–20"]]],
["Delts + Arms A",[["Syedee shoulder press machine",3,"8–10"],["Cable lateral raise",3,"12–20"],["EZ-bar curl",3,"8–10"],["Triceps cable pressdown",3,"10–15"],["DB hammer curl",2,"10–12"],["Rear-delt cable fly",3,"15–20"],["Standing cable crunch (light)",3,"12–15"]]],
["Lower-safe + core",[["Standing calf raise",4,"12–20"],["Glute bridge / hip raise",3,"10–15"],["Pallof press (light)",3,"10–12/side"]]],
["Chest + Back B",[["Incline barbell press",3,"6–10"],["Lat pulldown",3,"8–12"],["Chest press machine",3,"8–12"],["Seated cable row",3,"8–12"],["High-to-low cable fly",2,"12–15"],["Straight-arm pulldown",2,"12–15"]]],
["Delts + Arms B",[["Syedee shoulder press machine",2,"8–12"],["Cable lateral raise",3,"12–20"],["EZ-bar curl",3,"6–10"],["Overhead cable triceps extension",3,"10–15"],["Cable curl",2,"10–15"],["Rear-delt cable fly",2,"15–20"],["Standing calf raise",2,"12–20"],["Standing cable crunch (light)",3,"10–15"],["Pallof press (light)",2,"12/side"]]],
["Optional recovery walk",[]],
["Rest",[]]];
const TABS=[["dashboard","🏠 Dashboard"],["workouts","🏋️ Workouts"],["nutrition","🥩 Nutrition"],["cardio","🚶 Cardio"],["measure","📏 Measurements"],["checkin","📋 Check-in"],["roadmap","🗓️ Roadmap"],["settings","⚙️ Settings"]];
const DEF={start:"2026-11-23",targets:{cal:2205,p:190,c:215,f:65},baseline:{weight:0,waist:0,neck:0},workouts:[],meals:[],walks:[],measurements:[],checkins:[],drafts:{},selected:0};
let db,storageIssue="";
try{
 const raw=localStorage.getItem("thor-phase1-v1");
 db=raw?JSON.parse(raw):JSON.parse(JSON.stringify(DEF));
 if(!db||typeof db!=="object")throw Error("Invalid stored data");
}catch(e){
 storageIssue="Unable to read existing workout records: "+String(e.message||e)+". Do not enter new data until you export or recover your previous storage.";
 db=JSON.parse(JSON.stringify(DEF));
}
for(const k in DEF)if(db[k]==null)db[k]=JSON.parse(JSON.stringify(DEF[k]));
let tab="dashboard";
const $=id=>document.getElementById(id), date=()=>{let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=x=>Number(x)||0, save=(sync=true)=>{
 if(storageIssue){alert(storageIssue);return false}
 try{
  const payload=JSON.stringify(db);
  localStorage.setItem("thor-phase1-v1",payload);
  if(localStorage.getItem("thor-phase1-v1")!==payload)throw Error("Read-back verification failed");
  if(sync)queueCloud();
  return true;
 }catch(e){
  storageIssue="Storage verification failed: "+String(e.message||e);
  const banner=document.getElementById("storage-alert");
  if(banner)banner.textContent=storageIssue;
  alert(storageIssue+". Please export your backup in Settings.");
  return false;
 }
};
const recent=(arr,key,original)=>arr.slice().filter(x=>Number(x[key])>0).sort((a,b)=>a.date.localeCompare(b.date)).at(-1)?.[key]??original;
const sum=()=>db.meals.filter(x=>x.date===date()).reduce((a,x)=>{for(const k of ["cal","p","c","f"])a[k]+=num(x[k]);return a},{cal:0,p:0,c:0,f:0});
const bar=(x,y)=>'<div class="bar"><span style="width:'+Math.min(100,100*x/Math.max(1,y))+'%"></span></div>';
function go(t){tab=t;render();scrollTo(0,0)}
function render(){
$("storage-alert").textContent=storageIssue;
$("nav").innerHTML=TABS.map(([id,label])=>'<button class="'+(tab===id?"sel":"")+'" onclick="go(\''+id+'\')">'+label+'</button>').join("");
$("root").innerHTML=({dashboard,workouts,nutrition,cardio,measure,checkin,roadmap,settings})[tab]();
}
function dashboard(){const totals=sum(),start=new Date(db.start+"T00:00:00"),wk=Math.max(1,Math.min(28,Math.floor((new Date(date()+"T00:00:00")-start)/604800000)+1));
return '<div class="tiles"><section><small>PROTOCOL</small><div class="number">Week '+wk+'</div><small>of 28 · '+esc(currentPhase().label)+'</small></section><section><small>WEIGHT</small><div class="number">'+esc(recent(db.measurements,"weight",db.baseline.weight))+' lb</div><small>start '+db.baseline.weight+'</small></section><section><small>WAIST</small><div class="number">'+esc(recent(db.measurements,"waist",db.baseline.waist))+'″</div><small>start '+db.baseline.waist+'″</small></section><section><small>LOGGED SESSIONS</small><div class="number">'+db.workouts.length+'</div></section></div><section><h2>Today’s fueling</h2><b>'+Math.round(totals.cal)+' / '+db.targets.cal+' kcal</b>'+bar(totals.cal,db.targets.cal)+'<b>'+Math.round(totals.p)+' / '+db.targets.p+' g protein</b>'+bar(totals.p,db.targets.p)+'<button class="gold" onclick="go(\'nutrition\')">Log a meal</button></section><section><h2>Today’s mission</h2><p>'+esc(phaseExercise((new Date().getDay()+6)%7)[0])+'</p><button class="gold" onclick="selectToday()">Open today’s workout</button><div class="callout"><strong>Current physique priorities:</strong> 1) gradual waist reduction, 2) upper-chest and shoulder definition, 3) lat width and rear delts, 4) full arms, traps and forearms. Current photos show meaningful muscle mass already; do not chase rapid scale loss. Photos cannot reliably establish body-fat percentage.</div><div class="callout">Council directive: no crash diets, water cuts or needless depletion. Keep performance, carbohydrates, hydration and recovery high enough to protect muscle fullness. Check waist weekly and compare photos every 4 weeks.</div></section>'}
function selectToday(){db.selected=(new Date().getDay()+6)%7;save();go("workouts")}
function choose(i){db.selected=i;save();render()}
function workouts(){let day=db.selected,ex=phaseExercise(day),id=selectedWorkoutDate+"-"+day,d=db.drafts[id]||{};
let recovered=Object.entries(db.drafts).filter(([key,v])=>Object.keys(v||{}).length && key!==id).sort((a,b)=>b[0].localeCompare(a[0]));
let tracked=db.workouts.slice().sort((a,b)=>b.date.localeCompare(a.date));
return '<section><h2>Training command center</h2><p class="muted">Storage is LOCAL to this exact browser profile, not your GitHub account. Use regular Safari consistently, or export and import when switching to the Home Screen app.</p><div class="callout">✅ Every weight, rep and RIR change is saved automatically on this device. Tap a previous workout below to view and recover it. Avoid switching between Safari and Home Screen versions until backups are exported.</div><div class="flex"><label>Workout date <input aria-label="Workout date" type="date" value="'+esc(selectedWorkoutDate)+'" onchange="chooseWorkoutDate(this.value)"></label><button onclick="chooseWorkoutDate(date())">Today</button></div><p id="save-state" class="muted">Loaded stored session for '+esc(selectedWorkoutDate)+'</p><div class="callout"><strong>Abs protocol:</strong> Tue: standing cable crunch 3 × 12–15; Wed: light Pallof press 3 × 10–12/side; Fri: standing cable crunch 3 × 10–15 and Pallof press 2 × 12/side. Begin light, breathe normally, avoid excessive bracing and discontinue any movement provoking fissure pain or bleeding. No leg raises.</div><div class="callout">Active phase: '+esc(currentPhase().label)+' (week '+programWeek()+'). First-time estimated weights are shown for EVERY exercise. After logging completed sets, next-session load recommendations update automatically. Cable/machine weights are not interchangeable. Warm up and leave 2–3 RIR; never strain or train through fissure symptoms.</div><div class="days">'+["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((s,i)=>'<button class="'+(i===day?"sel":"")+'" onclick="choose('+i+')">'+s+'</button>').join("")+'</div><h2>'+esc(ex[0])+'</h2><p>Main lifting days 60–75 min. Start with 2–3 reps in reserve; rest 2–3 min for compounds and 60–90 sec on accessories. Superset only accessory exercises; optional drop set on the final curl OR lateral raise set once weekly. No straining or breath-holding.</p>'+(!ex[1].length?'<div class="callout">Optional easy walk, gentle mobility or rest.</div>':ex[1].map((x,i)=>'<div class="item"><strong>'+esc(x[0])+'</strong> <small>'+x[1]+' × '+esc(x[2])+'</small>'+suggestion(x[0],x[2],x[1])+Array.from({length:x[1]},(_,j)=>{let v=d[i+"_"+j]||{};return '<div class="set"><small>'+(j+1)+'</small><input type="number" aria-label="Weight pounds" placeholder="'+esc(suggestedPlaceholder(x[0],x[2],x[1]))+'" min="0" value="'+esc(v.w??"")+'" oninput="setval('+i+','+j+',\'w\',this.value)"><input type="number" aria-label="Repetitions" placeholder="reps" min="0" value="'+esc(v.r??"")+'" oninput="setval('+i+','+j+',\'r\',this.value)"><input type="number" aria-label="Reps in reserve" placeholder="RIR" min="0" value="'+esc(v.rir??"")+'" oninput="setval('+i+','+j+',\'rir\',this.value)"><input type="checkbox" aria-label="Completed" '+(v.done?"checked":"")+' oninput="setval('+i+','+j+',\'done\',this.checked)"></div>'}).join("")+'</div>').join("")+'<button class="gold" onclick="finish()">Mark workout complete</button>')+'</section><section><h2>Previous entries and recovery</h2><p class="muted">Tap an entry to reopen its date and day, including workouts not marked complete.</p>'+tracked.slice(0,30).map(x=>'<div class="entry"><button onclick="openStored(\''+esc(x.date)+'\','+Number(x.day??guessDay(x.name))+')">'+esc(x.date)+' · '+esc(x.name)+' · '+(x.status==="complete"?"Complete":"Autosaved")+' · '+x.sets.length+' sets</button><div class="muted">'+x.sets.slice(0,8).map(s=>esc(s.exercise)+' '+esc(s.weight)+'lb × '+esc(s.reps)+' · ').join("")+'</div></div>').join("")+recovered.slice(0,30).map(([key,v])=>'<div class="entry"><button onclick="openDraft(\''+esc(key)+'\')">Recover '+esc(key)+' · '+Object.keys(v).length+' entries</button></div>').join("")+'</section>'}
let selectedWorkoutDate=date();
function guessDay(name){let i=EX.findIndex(x=>x[0]===name);return Math.max(0,i)}
function chooseWorkoutDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return;selectedWorkoutDate=value;render()}
function openStored(d,i){
 selectedWorkoutDate=d;db.selected=i;
 const id=d+"-"+i;
 if(!db.drafts[id]){
  const w=db.workouts.find(x=>x.id===id||x.date===d&&x.day===i);
  if(w){const draft={};(w.sets||[]).forEach(s=>{
   const index=phaseExercise(i)[1].findIndex(ex=>ex[0]===s.exercise);
   if(index>=0)draft[index+"_"+Math.max(0,Number(s.set||1)-1)]={w:s.weight,r:s.reps,rir:s.rir,done:!!s.done};
  });db.drafts[id]=draft}
 }
 save();render();window.scrollTo(0,0)
}
function openDraft(key){
 const m=key.match(/^(\d{4}-\d{2}-\d{2})-(\d)$/);
 if(!m)return alert("Unrecognized draft key; use Settings to export a JSON backup.");
 selectedWorkoutDate=m[1];db.selected=Math.min(6,Math.max(0,Number(m[2])));save();render();window.scrollTo(0,0)
}
function syncWorkout(){
 let id=selectedWorkoutDate+"-"+db.selected,d=db.drafts[id]||{},ex=phaseExercise(db.selected);
 let sets=Object.entries(d).filter(([k,v])=>v && (v.w!==undefined&&v.w!=="" || v.r!==undefined&&v.r!=="" || v.done))
  .map(([k,v])=>{let ij=k.split("_").map(Number),exercise=ex[1][ij[0]];return exercise?{exercise:exercise[0],set:ij[1]+1,weight:num(v.w),reps:num(v.r),rir:v.rir===""?null:(v.rir===undefined?null:num(v.rir)),done:!!v.done}:null}).filter(Boolean);
 let idx=db.workouts.findIndex(x=>x.id===id || (!x.id && x.date===selectedWorkoutDate&&x.day===db.selected));
 if(sets.length){let session={id,date:selectedWorkoutDate,day:db.selected,name:ex[0],phase:currentPhase().label,sets,status:"in-progress",updatedAt:new Date().toISOString()};if(idx>=0){session.status=db.workouts[idx].status==="complete"?"complete":"in-progress";db.workouts[idx]=session}else db.workouts.push(session)}
 return save()
}
function setval(i,j,k,v){
 let id=selectedWorkoutDate+"-"+db.selected;
 db.drafts[id]??={};db.drafts[id][i+"_"+j]??={};db.drafts[id][i+"_"+j][k]=v;
 const ok=syncWorkout(),state=document.getElementById("save-state");
 if(state)state.textContent=ok?"✓ Autosaved at "+new Date().toLocaleTimeString():"⚠ Save failed — export a backup"
}
function finish(){
 const id=selectedWorkoutDate+"-"+db.selected,d=db.drafts[id]||{};
 if(!Object.values(d).some(v=>v.done)){alert("Check at least one finished set. Other entered sets remain autosaved.");return}
 if(!syncWorkout())return;
 const idx=db.workouts.findIndex(w=>w.id===id);if(idx<0)return;
 db.workouts[idx].status="complete";
 if(!save())return;
 render();if(confirm("Workout saved and verified on this browser. Download a backup now to protect your progress?"))backup()
}
function inputs(spec){return '<div class="fields">'+spec.map(([name,label,type,value])=>'<div><label>'+label+'</label><input name="'+name+'" type="'+(type||"number")+'" value="'+esc(value??"")+'" '+(type==="text"?'':"")+' required></div>').join("")+'</div>'}
function nutrition(){let t=sum();return '<div class="tiles">'+[["Calories","cal","kcal"],["Protein","p","g"],["Carbs","c","g"],["Fat","f","g"]].map(([label,key,u])=>'<section><small>'+label+'</small><div class="number">'+Math.round(t[key])+'</div><small>/ '+db.targets[key]+' '+u+'</small>'+bar(t[key],db.targets[key])+'</section>').join("")+'</div><section><h2>Log food</h2><form onsubmit="meal(event)">'+inputs([["date","Date","date",date()],["name","Food","text",""],["cal","Calories","number",""],["p","Protein g","number",""],["c","Carbs g","number",""],["f","Fat g","number",""]])+'<p><button class="gold">Save meal</button></p></form><div class="callout">For the first 14 days log ~2,205 kcal accurately, with 190 g protein, 215 g carbohydrate and 65 g fat. Include oils, snacks and weekends. Then use 7-day weight and waist trends to adjust.</div></section><section><h2>Recent meals</h2>'+db.meals.slice(-15).reverse().map(x=>'<div class="entry">'+esc(x.date)+' · <strong>'+esc(x.name)+'</strong> · '+x.cal+' kcal · '+x.p+'P '+x.c+'C '+x.f+'F</div>').join("")+'</section>'}
function meal(e){e.preventDefault();let f=new FormData(e.target),o={date:f.get("date"),name:f.get("name")};for(let k of ["cal","p","c","f"])o[k]=num(f.get(k));db.meals.push(o);save();render()}
function cardio(){return '<section><h2>Cardio & recovery log</h2><p>Begin with 2–3 easy walks of 15–20 minutes as tolerated; increase gradually from 4,000 daily steps without provoking symptoms.</p><form onsubmit="walk(event)">'+inputs([["date","Date","date",date()],["minutes","Minutes","number",20],["sleep","Sleep hours","number",7],["recovery","Recovery 1–5","number",3]])+'<label>Notes / symptoms (optional)</label><textarea name="notes" rows="2"></textarea><p><button class="gold">Save recovery</button></p></form></section><section><h2>Recent cardio</h2>'+db.walks.slice(-15).reverse().map(x=>'<div class="entry"><strong>'+esc(x.date)+' · '+esc(x.minutes)+' min</strong> · sleep '+esc(x.sleep)+' h · recovery '+esc(x.recovery)+'/5 <p>'+esc(x.notes)+'</p></div>').join("")+'</section>'}
function walk(e){e.preventDefault();db.walks.push(Object.fromEntries(new FormData(e.target).entries()));save();render()}
function measure(){
 return '<section><h2>Daily weight · weekly waist</h2><p>Weigh each morning. Waist is optional every day but required for weekly coaching; record it at the navel.</p><form onsubmit="bodylog(event)"><div class="fields"><div><label>Date</label><input required type="date" name="date" value="'+date()+'"></div><div><label>Weight lb</label><input required type="number" name="weight" min="50" max="500" step="0.1"></div><div><label>Waist in (weekly)</label><input type="number" name="waist" min="20" max="70" step="0.1"></div><div><label>Daily steps</label><input type="number" name="steps" min="0"></div><div><label>Sleep hours</label><input type="number" name="sleep" min="0" max="24" step="0.25"></div></div><p><button class="gold">Save measurements</button></p></form></section><section><h2>History</h2>'+db.measurements.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60).map(x=>'<div class="entry"><b>'+esc(x.date)+'</b> · '+esc(x.weight)+' lb'+(x.waist?' · '+esc(x.waist)+'″ waist':'')+(x.steps?' · '+esc(x.steps)+' steps':'')+'</div>').join("")+'</section>';
}
function bodylog(e){e.preventDefault();const x=Object.fromEntries(new FormData(e.target).entries());db.measurements=db.measurements.filter(m=>m.date!==x.date);db.measurements.push(x);if(save())render()}
function roadmap(){
 const p=[["Weeks 1–2","Calibrate","Accurately measure food, weight, recovery and training."],["Weeks 3–6","First fat-loss block","Manage a modest deficit while preserving performance."],["Weeks 7–16","Recomposition","Adjust the plan every 7–14 days from observed trends."],["Weeks 17–23","Refinement","Prioritize waist reduction, chest fullness and V-taper."],["Weeks 24–28","Camera-ready","No crash diet, water cut or aggressive training changes."]];
 return '<section><h2>28-week production plan</h2><div class="callout">Current: '+esc(currentPhase().label)+' · Week '+programWeek()+' / 28. '+esc(currentPhase().focus)+'</div>'+p.map(x=>'<div class="entry"><strong>'+x[0]+' · '+x[1]+'</strong><p>'+x[2]+'</p></div>').join("")+'</section>';
}
function settings(){return cloudSettings()+'<section><h2>Targets and timeline</h2><form onsubmit="targets(event)">'+inputs([["start","Start date","date",db.start],["cal","Calories","number",db.targets.cal],["p","Protein g","number",db.targets.p],["c","Carbs g","number",db.targets.c],["f","Fat g","number",db.targets.f]])+'<p><button class="gold">Save settings</button></p></form></section><section><h2>Privacy & backup</h2><div class="callout" id="diagnostic">Storage: '+esc(storageIssue||'No errors reported')+' · Recorded workouts: '+db.workouts.length+' · Unfinished date entries: '+Object.keys(db.drafts).length+'</div><button onclick="verifyPersistence()">Test save and read-back</button><p>GitHub Pages hosts code only. Your private records are stored on this device, not GitHub or Supabase. Export JSON frequently, especially before clearing browser data or switching devices.</p><button class="gold" onclick="backup()">Export JSON backup</button> <button onclick="csv()">Export workout CSV</button><p><label>Import JSON backup <input type="file" accept=".json" onchange="restore(event)"></label></p><button onclick="wipe()">Clear local data</button></section>'}
function targets(e){e.preventDefault();let f=new FormData(e.target);db.start=f.get("start");for(let k of ["cal","p","c","f"])db.targets[k]=num(f.get(k));save();render()}
function download(data,name,type){let url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function verifyPersistence(){
 const nonce="thor-check-"+Date.now(),value="ok-"+Math.random();
 try{localStorage.setItem(nonce,value);const ok=localStorage.getItem(nonce)===value;localStorage.removeItem(nonce);alert(ok?"Storage test passed in THIS browser. This does not guarantee long-term persistence or cross-device sync.":"Storage read-back failed.")}catch(e){alert("Storage test failed: "+e.message)}
}

function programWeek(){const a=new Date(db.start+"T12:00:00"),b=new Date(date()+"T12:00:00");return Math.max(1,Math.min(28,Math.floor((b-a)/604800000)+1))}
function currentPhase(){return PHASES.find(x=>programWeek()>=x.from&&programWeek()<=x.to)||PHASES[0]}
function phaseExercise(day){
 const p=currentPhase(),base=EX[day]; if(day>=5)return base;
 const sets=base[1].map((x,i)=>{
 let n=x[1],reps=x[2];
 // Set additions only for the first two movements; cap volume conservatively.
 if(i<2)n=Math.max(2,Math.min(5,n+p.sets));
 if(p.rep==="strength" && i<2)reps="5–8";
 if(p.rep==="hypertrophy" && i<2)reps="8–12";
 return [x[0],n,reps]
 });
 return [base[0],sets]
}

function recommendedLoad(name,range,requiredSets){
 const p=STARTING_LOADS[name], lower=/^8/.test(range)&&name==="Lat pulldown"?145:p?.[0];
 const high=/^8/.test(range)&&name==="Lat pulldown"?155:p?.[1];
 const matches=db.workouts.filter(w=>w.date<selectedWorkoutDate&&(w.sets||[]).some(t=>t.exercise===name&&t.done&&Number(t.reps)>0)).sort((a,b)=>b.date.localeCompare(a.date)||String(b.updatedAt||"").localeCompare(String(a.updatedAt||"")));
 if(!matches.length){
  return p?{headline:"Recommended FIRST working weight: "+lower+" "+p[2],detail:"Trial window "+lower+"–"+high+" "+p[2]+". "+p[4]+" Warm up and adjust to leave 2–3 clean reps in reserve."}:{headline:"No reliable load estimate",detail:"Start light and find 2–3 reps in reserve."};
 }
 const last=matches[0], sets=(last.sets||[]).filter(x=>x.exercise===name&&x.done&&Number(x.reps)>0&&Number.isFinite(Number(x.weight))).sort((a,b)=>Number(a.set||0)-Number(b.set||0));
 if(!sets.length)return {headline:"Establish a working load",detail:"No completed set is recorded."};
 const weight=Number(sets[0].weight), inc=p?.[3]||2.5, reps=(range.match(/\d+/g)||[]).map(Number), min=reps[0]||8, max=reps[1]||min;
 const same=sets.every(x=>Number(x.weight)===weight);
 const increase=sets.length>=requiredSets&&same&&sets.every(x=>Number(x.reps)>=max&&x.rir!=null&&Number(x.rir)>=2);
 const decrease=sets.some(x=>Number(x.reps)<min||(x.rir!=null&&Number(x.rir)===0));
 const proposed=increase?weight+inc:decrease?Math.max(0,Math.round(weight*.95/inc)*inc):weight;
 const instruction=increase?"All prescribed sets met the high rep target with ≥2 RIR; add a small increment only if comfortable.":decrease?"Below rep target or 0 RIR: reduce weight and rebuild clean repetitions.":"Repeat this load; gain reps first. No increase until all sets reach the upper rep target with ≥2 RIR.";
 return {headline:"Recommended NEXT working weight: "+proposed+" "+(p?.[2]||"lb, same equipment"),detail:"Last completed "+last.date+": "+sets.map(x=>x.weight+"×"+x.reps+" (RIR "+(x.rir??"?")+")").join("; ")+". "+instruction};
}

function svgTrend(points,key,color){
 const arr=points.slice().sort((a,b)=>a.date.localeCompare(b.date)).filter(x=>Number.isFinite(Number(x[key]))&&num(x[key])>0).slice(-18);
 if(arr.length<2)return '<p class="muted">Add at least two measurements to display a trend.</p>';
 const vals=arr.map(x=>num(x[key])),lo=Math.min(...vals),hi=Math.max(...vals),span=Math.max(1,hi-lo);
 const coords=vals.map((v,i)=>(20+(i*320/(vals.length-1))).toFixed(1)+","+(120-(v-lo)*90/span).toFixed(1)).join(" ");
 return '<svg role="img" aria-label="'+esc(key)+' trend" viewBox="0 0 360 145" style="max-width:100%;height:auto"><line x1="20" y1="125" x2="345" y2="125" stroke="#607186"/><polyline points="'+coords+'" fill="none" stroke="'+color+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="18" y="15" font-size="12" fill="#b9c8d7">'+hi.toFixed(1)+'</text><text x="18" y="140" font-size="12" fill="#b9c8d7">'+lo.toFixed(1)+'</text></svg><p class="muted">'+arr.length+' logged points · '+esc(arr[0].date)+' to '+esc(arr.at(-1).date)+'</p>'
}
function strengthTrend(){
 const groups={};
 db.workouts.forEach(w=>(w.sets||[]).forEach(s=>{if(!groups[s.exercise])groups[s.exercise]=[];groups[s.exercise].push({date:w.date,weight:num(s.weight),reps:num(s.reps)})}));
 const names=Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length).slice(0,4);
 return names.length?names.map(name=>{
 const arr=groups[name],best=arr.reduce((a,b)=>Math.max(a,b.weight*(1+b.reps/30)),0);
 return '<div class="entry"><strong>'+esc(name)+'</strong><div class="muted">Estimated best performance index: '+best.toFixed(0)+' lb (Epley estimate, not a tested 1RM) · '+arr.length+' sets logged</div></div>'
 }).join(""):'<p class="muted">Save workouts to see strength summaries.</p>'
}

function checkinAdvice(a,b){
 if(!b)return 'Baseline saved. Compare it with your next weekly check-in before deciding on changes.';
 const days=Math.max(1,(new Date(a.date)-new Date(b.date))/86400000),rate=(num(b.weight)-num(a.weight))*7/days;
 if(num(a.adherence)<80)return 'Prioritize logging consistency before adjusting calories or training volume.';
 if(num(a.recovery)<=2||num(a.performance)<=2)return 'Recovery or performance is low. Review sleep, fatigue, and session volume; avoid increasing intensity automatically.';
 if(rate>1.5)return 'Weight is dropping faster than our initial target; confirm weekly averages and review strength, fullness, fatigue and hydration.';
 if(rate<0.1&&num(a.waist)>=num(b.waist)&&days>=10)return 'Weight and waist trends appear stalled. Confirm intake and activity before considering a modest adjustment.';
 return 'Progress appears compatible with a gradual transformation. Maintain current approach and keep tracking.'
}

  });

function cloneCloud(o){return JSON.parse(JSON.stringify(o||{}))}
function cloudFingerprint(item){
 if(item.id!=null)return String(item.id);
 if(item.date && item.name)return String(item.date)+"|"+String(item.name);
 return JSON.stringify(item);
}
function mergeSessions(a,b){
 const newer=(Date.parse(b.updatedAt||"")||0)>=(Date.parse(a.updatedAt||"")||0)?b:a;
 const older=newer===b?a:b,out=cloneCloud(newer);
 const combined=new Map();
 for(const s of older.sets||[])combined.set(String(s.exercise)+"|"+String(s.set??0),cloneCloud(s));
 for(const s of newer.sets||[])combined.set(String(s.exercise)+"|"+String(s.set??0),cloneCloud(s));
 out.sets=[...combined.values()];
 return out;
}
function mergeCloudState(remote,local){
 const a=cloneCloud(remote),b=cloneCloud(local),out=cloneCloud(DEF);
 const bNew=(Number(b._editedAt)||0)>=(Number(a._editedAt)||0);
 Object.assign(out,bNew?a:b);
 out.targets={...DEF.targets,...(bNew?a.targets:b.targets),...(bNew?b.targets:a.targets)};
 out.baseline={...DEF.baseline,...(bNew?a.baseline:b.baseline),...(bNew?b.baseline:a.baseline)};
 out.drafts={...(a.drafts||{})};
 for(const [key,record] of Object.entries(b.drafts||{})){
  const target=out.drafts[key]||{};
  out.drafts[key]={...target,...record};
 }
 for(const key of ["workouts","meals","walks","measurements","checkins"]){
  const records=new Map();
  for(const item of a[key]||[])records.set(cloudFingerprint(item),cloneCloud(item));
  for(const item of b[key]||[]){
   const id=cloudFingerprint(item),previous=records.get(id);
   records.set(id,key==="workouts"&&previous?mergeSessions(previous,item):cloneCloud(item));
  }
  out[key]=[...records.values()];
 }
 out._editedAt=Math.max(Number(a._editedAt)||0,Number(b._editedAt)||0);
 return out;
}
async function cloudInitializeUser(userId){
 if(!cloudClient||!cloudUser||cloudUser.id!==userId||storageIssue)return;
 cloudReady=false;
 try{
  cloudLabel("Loading cloud history and merging local entries…");
  const {data,error}=await cloudClient.from("thor_documents").select("content,revision").eq("owner_id",userId).eq("document_id","app/state").maybeSingle();
  if(error)throw error;
  if(db._cloudOwner && db._cloudOwner!==userId){cloudLabel("Account mismatch — export a backup and sign in with your original account.");return}
  db=mergeCloudState(data?.content||{},db);
  db._cloudOwner=userId;
  if(!save(false))throw Error("Local storage is not writable. Export your data.");
  render();
  cloudReady=true;
  await cloudPush();
 }catch(e){cloudReady=false;cloudLabel("Cloud restore failed: "+String(e.message||e)+". Local records remain available.")}
}
function queueCloud(){
 db._editedAt=Date.now();

 cloudQueued=true;
 clearTimeout(cloudTimer);
 cloudTimer=setTimeout(()=>{cloudChain=cloudChain.then(()=>cloudPush()).catch(e=>cloudLabel("Cloud error: "+String(e.message||e)));},650);
 cloudLabel("Saved on device — cloud sync pending");
}
async function cloudPush(){
 if(!cloudClient||!cloudUser||!cloudReady)return;
 const uid=cloudUser.id;
 if(db._cloudOwner && db._cloudOwner!==uid){cloudLabel("Account mismatch — cloud upload blocked");return}
 cloudQueued=false;cloudBusy=true;
 cloudLabel("Syncing to cloud…");
 try{
  const {data,error}=await cloudClient.from("thor_documents").select("content,revision").eq("owner_id",uid).eq("document_id","app/state").maybeSingle();
  if(error)throw error;
  const merged=mergeCloudState(data?.content||{},db);
  const {error:writeError}=await cloudClient.from("thor_documents").upsert({
   owner_id:uid,document_id:"app/state",content:cloneCloud(merged),
   revision:(Number(data?.revision)||0)+1,updated_at:new Date().toISOString()
  },{onConflict:"owner_id,document_id"});
  if(writeError)throw writeError;
  const {data:verified,error:verificationError}=await cloudClient.from("thor_documents").select("revision").eq("owner_id",uid).eq("document_id","app/state").single();
  if(verificationError||!verified||Number(verified.revision)<Number(data?.revision||0)+1)throw Error("Cloud read-back verification failed");
  db=mergeCloudState(db,merged);
  db._cloudOwner=uid;
  if(!save(false))throw Error("Could not verify local copy after cloud sync");
  cloudLastSync=new Date().toLocaleString();
  cloudLabel("✓ Synced to cloud — "+cloudLastSync);
  if(tab==="settings")render();
 }catch(e){
  cloudQueued=true;
  cloudLabel("⚠ Not synced: "+String(e.message||e)+". Data remains local; retry Sync now.");
 }finally{
  cloudBusy=false;
 }
}

}
