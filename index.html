</style></head><body><main><header><small>⚡ THE 52-WEEK WARRIOR FORGE</small><h1>PROJECT THOR</h1><div>Full muscles · Smaller waist · Strength preserved</div></header><nav id="nav"></nav><div id="storage-alert" class="danger" role="alert"></div><div id="root">Loading Project Thor…</div><small>⚡ Local autosave is immediate. Cloud backup is available after sign-in; verify the cloud sync status in Settings. Export JSON backups regularly.</small></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script>
"use strict";
const EX=[
["Chest + Back",[["Barbell bench press",4,"5–8"],["Lat pulldown / pull-up",4,"6–10"],["Incline barbell press",3,"8–10"],["Chest-supported row",3,"8–12"],["Cable fly",2,"12–15"]]],
["Shoulders + Arms",[["Shoulder press machine",3,"6–10"],["Cable lateral raise",4,"12–20"],["EZ-bar curl",3,"8–12"],["Cable triceps pressdown",3,"10–15"],["Incline dumbbell curl",3,"10–12"],["Reverse cable fly",3,"12–20"],["Dead bug",2,"8/side"]]],
["Back + Abs",[["Lat pulldown",3,"10–12"],["Seated cable row",3,"8–12"],["Straight-arm pulldown",3,"12–15"],["Cable face pull",3,"15–20"],["Cable crunch",3,"10–15"],["Dead bug",3,"10/side"]]],
["Chest + Shoulders",[["Incline barbell press",3,"6–10"],["Chest press machine",3,"8–12"],["High-to-low cable fly",3,"12–15"],["Cable lateral raise",4,"12–20"],["Reverse cable fly",3,"15–20"],["Pallof press",2,"10/side"]]],
["Arms + Rear Delts",[["EZ-bar curl",3,"6–10"],["Overhead cable triceps extension",3,"10–12"],["DB hammer curl",3,"10–12"],["Cable pressdown",3,"12–15"],["Cable preacher curl",2,"12–15"],["Rear-delt cable fly",3,"15–20"],["Standing calf raise",3,"12–20"],["Dumbbell shrug",2,"10–15"]]],
["Recovery + cardio",[]],["Rest",[]]];
const TABS=[["dashboard","🏠 Dashboard"],["workouts","🏋️ Workouts"],["nutrition","🥩 Nutrition"],["cardio","🚶 Cardio"],["measure","📏 Measurements"],["checkin","📋 Check-in"],["roadmap","🗓️ Roadmap"],["settings","⚙️ Settings"]];
const DEF={start:"2026-10-24",targets:{cal:2350,p:190,c:245,f:68},baseline:{weight:198,waist:40,neck:15.5},workouts:[],meals:[],walks:[],measurements:[],checkins:[],drafts:{},selected:0};
let db,storageIssue="";
try{
 const raw=localStorage.getItem("thor-app-v1");
 db=raw?JSON.parse(raw):JSON.parse(JSON.stringify(DEF));
 if(!db||typeof db!=="object")throw Error("Invalid stored data");
}catch(e){
 storageIssue="Unable to read existing workout records: "+String(e.message||e)+". Do not enter new data until you export or recover your previous storage.";
 db=JSON.parse(JSON.stringify(DEF));
}
for(const k in DEF)if(db[k]==null)db[k]=JSON.parse(JSON.stringify(DEF[k]));
let tab="dashboard";
const $=id=>document.getElementById(id), date=()=>{let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=x=>Number(x)||0, save=(sync=true)=>{
 if(storageIssue){alert(storageIssue);return false}
 try{
  const payload=JSON.stringify(db);
  localStorage.setItem("thor-app-v1",payload);
  if(localStorage.getItem("thor-app-v1")!==payload)throw Error("Read-back verification failed");
  if(sync)queueCloud();
  return true;
 }catch(e){
  storageIssue="Storage verification failed: "+String(e.message||e);
  const banner=document.getElementById("storage-alert");
  if(banner)banner.textContent=storageIssue;
  alert(storageIssue+". Please export your backup in Settings.");
  return false;
 }
};
const recent=(arr,key,original)=>arr.length?arr.slice().sort((a,b)=>a.date.localeCompare(b.date)).at(-1)[key]:original;
const sum=()=>db.meals.filter(x=>x.date===date()).reduce((a,x)=>{for(const k of ["cal","p","c","f"])a[k]+=num(x[k]);return a},{cal:0,p:0,c:0,f:0});
const bar=(x,y)=>'<div class="bar"><span style="width:'+Math.min(100,100*x/Math.max(1,y))+'%"></span></div>';
function go(t){tab=t;render();scrollTo(0,0)}
function render(){
$("storage-alert").textContent=storageIssue;
$("nav").innerHTML=TABS.map(([id,label])=>'<button class="'+(tab===id?"sel":"")+'" onclick="go(\''+id+'\')">'+label+'</button>').join("");
$("root").innerHTML=({dashboard,workouts,nutrition,cardio,measure,checkin,roadmap,settings})[tab]();
}
function dashboard(){const totals=sum(),start=new Date(db.start+"T00:00:00"),wk=Math.max(1,Math.min(52,Math.floor((new Date(date()+"T00:00:00")-start)/604800000)+1));
return '<div class="tiles"><section><small>PROTOCOL</small><div class="number">Week '+wk+'</div><small>of 52 · '+esc(currentPhase().label)+'</small></section><section><small>WEIGHT</small><div class="number">'+esc(recent(db.measurements,"weight",db.baseline.weight))+' lb</div><small>start '+db.baseline.weight+'</small></section><section><small>WAIST</small><div class="number">'+esc(recent(db.measurements,"waist",db.baseline.waist))+'″</div><small>start '+db.baseline.waist+'″</small></section><section><small>LOGGED SESSIONS</small><div class="number">'+db.workouts.length+'</div></section></div><section><h2>Today’s fueling</h2><b>'+Math.round(totals.cal)+' / '+db.targets.cal+' kcal</b>'+bar(totals.cal,db.targets.cal)+'<b>'+Math.round(totals.p)+' / '+db.targets.p+' g protein</b>'+bar(totals.p,db.targets.p)+'<button class="gold" onclick="go(\'nutrition\')">Log a meal</button></section><section><h2>Today’s mission</h2><p>'+esc(phaseExercise((new Date().getDay()+6)%7)[0])+'</p><button class="gold" onclick="selectToday()">Open today’s workout</button><div class="callout"><strong>Photo-based physique priorities — Oct 28 baseline:</strong> 1) gradual waist reduction, 2) upper-chest and shoulder definition, 3) lat width and rear delts, 4) full arms, traps and forearms. Current photos show meaningful muscle mass already; do not chase rapid scale loss. Photos cannot reliably establish body-fat percentage.</div><div class="callout">Council directive: no crash diets, water cuts or needless depletion. Keep performance, carbohydrates, hydration and recovery high enough to protect muscle fullness. Check waist weekly and compare photos every 4 weeks.</div></section>'}
function selectToday(){db.selected=(new Date().getDay()+6)%7;save();go("workouts")}
function choose(i){db.selected=i;save();render()}
function workouts(){let day=db.selected,ex=phaseExercise(day),id=selectedWorkoutDate+"-"+day,d=db.drafts[id]||{};
let recovered=Object.entries(db.drafts).filter(([key,v])=>Object.keys(v||{}).length && key!==id).sort((a,b)=>b[0].localeCompare(a[0]));
let tracked=db.workouts.slice().sort((a,b)=>b.date.localeCompare(a.date));
return '<section><h2>Training command center</h2><p class="muted">Storage is LOCAL to this exact browser profile, not your GitHub account. Use regular Safari consistently, or export and import when switching to the Home Screen app.</p><div class="callout">✅ Every weight, rep and RIR change is saved automatically on this device. Tap a previous workout below to view and recover it. Avoid switching between Safari and Home Screen versions until backups are exported.</div><div class="flex"><label>Workout date <input aria-label="Workout date" type="date" value="'+esc(selectedWorkoutDate)+'" onchange="chooseWorkoutDate(this.value)"></label><button onclick="chooseWorkoutDate(date())">Today</button></div><p id="save-state" class="muted">Loaded stored session for '+esc(selectedWorkoutDate)+'</p><div class="callout">Active phase: '+esc(currentPhase().label)+' (week '+programWeek()+'). Load suggestions use your previous logged sets. Keep 1–3 reps in reserve and avoid symptoms.</div><div class="days">'+["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((s,i)=>'<button class="'+(i===day?"sel":"")+'" onclick="choose('+i+')">'+s+'</button>').join("")+'</div><h2>'+esc(ex[0])+'</h2><p>60–75 min lifting · start 2–3 reps in reserve · build load only with controlled technique. Avoid symptomatic straining.</p>'+(!ex[1].length?'<div class="callout">Optional easy walk, gentle mobility or rest.</div>':ex[1].map((x,i)=>'<div class="item"><strong>'+esc(x[0])+'</strong> <small>'+x[1]+' × '+esc(x[2])+'</small>'+suggestion(x[0],x[2])+Array.from({length:x[1]},(_,j)=>{let v=d[i+"_"+j]||{};return '<div class="set"><small>'+(j+1)+'</small><input type="number" aria-label="Weight pounds" placeholder="lb" min="0" value="'+esc(v.w??"")+'" oninput="setval('+i+','+j+',\'w\',this.value)"><input type="number" aria-label="Repetitions" placeholder="reps" min="0" value="'+esc(v.r??"")+'" oninput="setval('+i+','+j+',\'r\',this.value)"><input type="number" aria-label="Reps in reserve" placeholder="RIR" min="0" value="'+esc(v.rir??"")+'" oninput="setval('+i+','+j+',\'rir\',this.value)"><input type="checkbox" aria-label="Completed" '+(v.done?"checked":"")+' oninput="setval('+i+','+j+',\'done\',this.checked)"></div>'}).join("")+'</div>').join("")+'<button class="gold" onclick="finish()">Mark workout complete</button>')+'</section><section><h2>Previous entries and recovery</h2><p class="muted">Tap an entry to reopen its date and day, including workouts not marked complete.</p>'+tracked.slice(0,30).map(x=>'<div class="entry"><button onclick="openStored(\''+esc(x.date)+'\','+Number(x.day??guessDay(x.name))+')">'+esc(x.date)+' · '+esc(x.name)+' · '+(x.status==="complete"?"Complete":"Autosaved")+' · '+x.sets.length+' sets</button><div class="muted">'+x.sets.slice(0,8).map(s=>esc(s.exercise)+' '+esc(s.weight)+'lb × '+esc(s.reps)+' · ').join("")+'</div></div>').join("")+recovered.slice(0,30).map(([key,v])=>'<div class="entry"><button onclick="openDraft(\''+esc(key)+'\')">Recover '+esc(key)+' · '+Object.keys(v).length+' entries</button></div>').join("")+'</section>'}
let selectedWorkoutDate=date();
function guessDay(name){let i=EX.findIndex(x=>x[0]===name);return Math.max(0,i)}
function chooseWorkoutDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return;selectedWorkoutDate=value;render()}
function openStored(d,i){
 selectedWorkoutDate=d;db.selected=i;
 const id=d+"-"+i;
 if(!db.drafts[id]){
  const w=db.workouts.find(x=>x.id===id||x.date===d&&x.day===i);
  if(w){const draft={};(w.sets||[]).forEach(s=>{
   const index=phaseExercise(i)[1].findIndex(ex=>ex[0]===s.exercise);
   if(index>=0)draft[index+"_"+Math.max(0,Number(s.set||1)-1)]={w:s.weight,r:s.reps,rir:s.rir,done:!!s.done};
  });db.drafts[id]=draft}
 }
 save();render();window.scrollTo(0,0)
}
function openDraft(key){
 const m=key.match(/^(\d{4}-\d{2}-\d{2})-(\d)$/);
 if(!m)return alert("Unrecognized draft key; use Settings to export a JSON backup.");
 selectedWorkoutDate=m[1];db.selected=Math.min(6,Math.max(0,Number(m[2])));save();render();window.scrollTo(0,0)
}
function syncWorkout(){
 let id=selectedWorkoutDate+"-"+db.selected,d=db.drafts[id]||{},ex=phaseExercise(db.selected);
 let sets=Object.entries(d).filter(([k,v])=>v && (v.w!==undefined&&v.w!=="" || v.r!==undefined&&v.r!=="" || v.done))
  .map(([k,v])=>{let ij=k.split("_").map(Number),exercise=ex[1][ij[0]];return exercise?{exercise:exercise[0],set:ij[1]+1,weight:num(v.w),reps:num(v.r),rir:v.rir===""?null:(v.rir===undefined?null:num(v.rir)),done:!!v.done}:null}).filter(Boolean);
 let idx=db.workouts.findIndex(x=>x.id===id || (!x.id && x.date===selectedWorkoutDate&&x.day===db.selected));
 if(sets.length){let session={id,date:selectedWorkoutDate,day:db.selected,name:ex[0],phase:currentPhase().label,sets,status:"in-progress",updatedAt:new Date().toISOString()};if(idx>=0){session.status=db.workouts[idx].status==="complete"?"complete":"in-progress";db.workouts[idx]=session}else db.workouts.push(session)}
 return save()
}
function setval(i,j,k,v){
 let id=selectedWorkoutDate+"-"+db.selected;
 db.drafts[id]??={};db.drafts[id][i+"_"+j]??={};db.drafts[id][i+"_"+j][k]=v;
 const ok=syncWorkout(),state=document.getElementById("save-state");
 if(state)state.textContent=ok?"✓ Autosaved at "+new Date().toLocaleTimeString():"⚠ Save failed — export a backup"
}
function finish(){
 const id=selectedWorkoutDate+"-"+db.selected,d=db.drafts[id]||{};
 if(!Object.values(d).some(v=>v.done)){alert("Check at least one finished set. Other entered sets remain autosaved.");return}
 if(!syncWorkout())return;
 const idx=db.workouts.findIndex(w=>w.id===id);if(idx<0)return;
 db.workouts[idx].status="complete";
 if(!save())return;
 render();if(confirm("Workout saved and verified on this browser. Download a backup now to protect your progress?"))backup()
}
function inputs(spec){return '<div class="fields">'+spec.map(([name,label,type,value])=>'<div><label>'+label+'</label><input name="'+name+'" type="'+(type||"number")+'" value="'+esc(value??"")+'" '+(type==="text"?'':"")+' required></div>').join("")+'</div>'}
function nutrition(){let t=sum();return '<div class="tiles">'+[["Calories","cal","kcal"],["Protein","p","g"],["Carbs","c","g"],["Fat","f","g"]].map(([label,key,u])=>'<section><small>'+label+'</small><div class="number">'+Math.round(t[key])+'</div><small>/ '+db.targets[key]+' '+u+'</small>'+bar(t[key],db.targets[key])+'</section>').join("")+'</div><section><h2>Log food</h2><form onsubmit="meal(event)">'+inputs([["date","Date","date",date()],["name","Food","text",""],["cal","Calories","number",""],["p","Protein g","number",""],["c","Carbs g","number",""],["f","Fat g","number",""]])+'<p><button class="gold">Save meal</button></p></form><div class="callout">Starting target ~2,350 kcal; 190 g protein; 245 g carbs; 68 g fat. Keep weekends accountable. Adjust only after sufficient trend data.</div></section><section><h2>Recent meals</h2>'+db.meals.slice(-15).reverse().map(x=>'<div class="entry">'+esc(x.date)+' · <strong>'+esc(x.name)+'</strong> · '+x.cal+' kcal · '+x.p+'P '+x.c+'C '+x.f+'F</div>').join("")+'</section>'}
function meal(e){e.preventDefault();let f=new FormData(e.target),o={date:f.get("date"),name:f.get("name")};for(let k of ["cal","p","c","f"])o[k]=num(f.get(k));db.meals.push(o);save();render()}
function cardio(){return '<section><h2>Cardio & recovery log</h2><p>Aim for 20–30 min walking as tolerated. No treadmill incline or exertion is mandatory.</p><form onsubmit="walk(event)">'+inputs([["date","Date","date",date()],["minutes","Minutes","number",20],["sleep","Sleep hours","number",7],["recovery","Recovery 1–5","number",3]])+'<label>Notes / symptoms (optional)</label><textarea name="notes" rows="2"></textarea><p><button class="gold">Save recovery</button></p></form></section><section><h2>Recent cardio</h2>'+db.walks.slice(-15).reverse().map(x=>'<div class="entry"><strong>'+esc(x.date)+' · '+esc(x.minutes)+' min</strong> · sleep '+esc(x.sleep)+' h · recovery '+esc(x.recovery)+'/5 <p>'+esc(x.notes)+'</p></div>').join("")+'</section>'}
function walk(e){e.preventDefault();db.walks.push(Object.fromEntries(new FormData(e.target).entries()));save();render()}
function measure(){return '<section><h2>Body measurements</h2><p>Consistent morning measurements; compare 7-day weight averages, waist, strength, and progress photos.</p><form onsubmit="bodylog(event)">'+inputs([["date","Date","date",date()],["weight","Weight lb","number",recent(db.measurements,"weight",198)],["waist","Waist in","number",recent(db.measurements,"waist",40)],["neck","Neck in","number",15.5]])+'<p><button class="gold">Save measurements</button></p></form></section><section><h2>Check-in history</h2>'+db.measurements.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>'<div class="entry"><strong>'+esc(x.date)+'</strong> · '+esc(x.weight)+' lb · waist '+esc(x.waist)+'″ · neck '+esc(x.neck)+'″</div>').join("")+'</section>'}
function bodylog(e){e.preventDefault();db.measurements.push(Object.fromEntries(new FormData(e.target).entries()));save();render()}
function roadmap(){return '<section><h2>52-week production plan</h2><div class="callout">Current: '+esc(currentPhase().label)+' · Week '+programWeek()+' / 52. '+esc(currentPhase().focus)+'</div>'+[["1–8","Foundation","Establish strength, volume and a sustainable fat-loss trend."],["9–16","Forge","Progress overload; prioritize delts, upper chest, back and arms."],["17–28","Build","Reassess calories, strength and physique; maintain or build as appropriate."],["29–40","Refine","Continue muscle development, waist reduction and recovery."],["41–48","Reveal","Incrementally sharpen definition without depleting muscle."],["49–52","Camera-ready","Stable food, hydration, performance and presentation; no extreme dehydration."]].map(x=>'<div class="entry"><strong>Weeks '+x[0]+' · '+x[1]+'</strong><p>'+x[2]+'</p></div>').join("")+'</section>'}
function settings(){return cloudSettings()+'<section><h2>Targets and timeline</h2><form onsubmit="targets(event)">'+inputs([["start","Start date","date",db.start],["cal","Calories","number",db.targets.cal],["p","Protein g","number",db.targets.p],["c","Carbs g","number",db.targets.c],["f","Fat g","number",db.targets.f]])+'<p><button class="gold">Save settings</button></p></form></section><section><h2>Privacy & backup</h2><div class="callout" id="diagnostic">Storage: '+esc(storageIssue||'No errors reported')+' · Recorded workouts: '+db.workouts.length+' · Unfinished date entries: '+Object.keys(db.drafts).length+'</div><button onclick="verifyPersistence()">Test save and read-back</button><p>GitHub Pages hosts only the app code. Local records are stored in this browser; signed-in records can also sync to Supabase. Export before clearing browser data and verify cloud status before switching devices.</p><button class="gold" onclick="backup()">Export JSON backup</button> <button onclick="csv()">Export workout CSV</button><p><label>Import JSON backup <input type="file" accept=".json" onchange="restore(event)"></label></p><button onclick="wipe()">Clear local data</button></section>'}
function targets(e){e.preventDefault();let f=new FormData(e.target);db.start=f.get("start");for(let k of ["cal","p","c","f"])db.targets[k]=num(f.get(k));save();render()}
function download(data,name,type){let url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function verifyPersistence(){
 const nonce="thor-check-"+Date.now(),value="ok-"+Math.random();
 try{localStorage.setItem(nonce,value);const ok=localStorage.getItem(nonce)===value;localStorage.removeItem(nonce);alert(ok?"Storage test passed in THIS browser. This does not guarantee long-term persistence or cross-device sync.":"Storage read-back failed.")}catch(e){alert("Storage test failed: "+e.message)}
}
function backup(){download(JSON.stringify(db,null,2),"project-thor-"+date()+".json","application/json")}
function csv(){let rows=[["date","workout","exercise","weight_lb","reps","rir"]];db.workouts.forEach(x=>x.sets.forEach(s=>rows.push([x.date,x.name,s.exercise,s.weight,s.reps,s.rir])));download(rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n"),"thor-workouts.csv","text/csv")}
function restore(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.workouts)||!Array.isArray(x.meals)||!Array.isArray(x.measurements))throw Error("Invalid backup");if(confirm("Replace current local records?")){db=x;for(const k in DEF)if(db[k]==null)db[k]=JSON.parse(JSON.stringify(DEF[k]));save();render()}}catch(e){alert(e.message)}};r.readAsText(file)}
function wipe(){alert("For your safety, local data deletion is disabled while cloud backup is being introduced. Export a JSON backup before requesting a reset.")}

const PHASES=[
 {from:1,to:8,label:"Foundation",sets:0,rep:"baseline",focus:"Retain strength; establish a measured waist-reduction trend."},
 {from:9,to:16,label:"Forge",sets:0,rep:"strength",focus:"Heavy hypertrophy with upper chest, back and shoulders prioritized."},
 {from:17,to:28,label:"Build",sets:1,rep:"hypertrophy",focus:"Muscle fullness and progressive volume within recovery capacity."},
 {from:29,to:40,label:"Refine",sets:0,rep:"hypertrophy",focus:"Improved proportions with consistent conditioning."},
 {from:41,to:48,label:"Reveal",sets:-1,rep:"baseline",focus:"Maintain strength as definition improves; avoid depletion."},
 {from:49,to:52,label:"Camera-ready",sets:-1,rep:"baseline",focus:"Maintain hydration, strength, and stable appearance; no crash cuts."}
];
function programWeek(){const a=new Date(db.start+"T12:00:00"),b=new Date(date()+"T12:00:00");return Math.max(1,Math.min(52,Math.floor((b-a)/604800000)+1))}
function currentPhase(){return PHASES.find(x=>programWeek()>=x.from&&programWeek()<=x.to)||PHASES[0]}
function phaseExercise(day){
 const p=currentPhase(),base=EX[day]; if(day>=5)return base;
 const sets=base[1].map((x,i)=>{
 let n=x[1],reps=x[2];
 // Set additions only for the first two movements; cap volume conservatively.
 if(i<2)n=Math.max(2,Math.min(5,n+p.sets));
 if(p.rep==="strength" && i<2)reps="5–8";
 if(p.rep==="hypertrophy" && i<2)reps="8–12";
 return [x[0],n,reps]
 });
 return [base[0],sets]
}
function suggestion(name,range){
 const matches=db.workouts.slice().reverse().flatMap(w=>w.sets||[]).filter(s=>s.exercise===name&&num(s.reps)>0);
 if(!matches.length)return '<div class="muted">First logged session — establish your starting weight.</div>';
 const previous=matches[0],all=matches.slice(0,6),top=Number((range.match(/\d+/g)||[]).slice(-1)[0]||10);
 const adequate=all.length>=2&&all.slice(0,2).every(s=>num(s.reps)>=top&&num(s.rir)>=1);
 const next=adequate?Math.round((num(previous.weight)+((/curl|fly|raise|extension|pressdown/i.test(name))?2.5:5))*2)/2:num(previous.weight);
 return '<div class="muted">Last logged: '+esc(previous.weight)+' lb × '+esc(previous.reps)+' reps · RIR '+esc(previous.rir??"—")+
 '. '+(adequate?'Possible next load: '+next+' lb if all prescribed sets stay controlled.':'Repeat approximately '+esc(previous.weight)+' lb and build clean reps before increasing.')+'</div>'
}
function svgTrend(points,key,color){
 const arr=points.slice().sort((a,b)=>a.date.localeCompare(b.date)).filter(x=>Number.isFinite(Number(x[key]))&&num(x[key])>0).slice(-18);
 if(arr.length<2)return '<p class="muted">Add at least two measurements to display a trend.</p>';
 const vals=arr.map(x=>num(x[key])),lo=Math.min(...vals),hi=Math.max(...vals),span=Math.max(1,hi-lo);
 const coords=vals.map((v,i)=>(20+(i*320/(vals.length-1))).toFixed(1)+","+(120-(v-lo)*90/span).toFixed(1)).join(" ");
 return '<svg role="img" aria-label="'+esc(key)+' trend" viewBox="0 0 360 145" style="max-width:100%;height:auto"><line x1="20" y1="125" x2="345" y2="125" stroke="#607186"/><polyline points="'+coords+'" fill="none" stroke="'+color+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="18" y="15" font-size="12" fill="#b9c8d7">'+hi.toFixed(1)+'</text><text x="18" y="140" font-size="12" fill="#b9c8d7">'+lo.toFixed(1)+'</text></svg><p class="muted">'+arr.length+' logged points · '+esc(arr[0].date)+' to '+esc(arr.at(-1).date)+'</p>'
}
function strengthTrend(){
 const groups={};
 db.workouts.forEach(w=>(w.sets||[]).forEach(s=>{if(!groups[s.exercise])groups[s.exercise]=[];groups[s.exercise].push({date:w.date,weight:num(s.weight),reps:num(s.reps)})}));
 const names=Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length).slice(0,4);
 return names.length?names.map(name=>{
 const arr=groups[name],best=arr.reduce((a,b)=>Math.max(a,b.weight*(1+b.reps/30)),0);
 return '<div class="entry"><strong>'+esc(name)+'</strong><div class="muted">Estimated best performance index: '+best.toFixed(0)+' lb (Epley estimate, not a tested 1RM) · '+arr.length+' sets logged</div></div>'
 }).join(""):'<p class="muted">Save workouts to see strength summaries.</p>'
}
function checkin(){
 let last=db.checkins.slice().sort((a,b)=>b.date.localeCompare(a.date));
 return '<section><h2>Weekly coaching check-in</h2><p>Use weight trend, waist, workout quality and recovery together. Recommendations are starting guidelines, not automatic medical or dietary prescriptions.</p><form onsubmit="saveCheckin(event)">'+inputs([
 ["date","Review date","date",date()],
 ["weight","7-day average weight (lb)","number",recent(db.measurements,"weight",198)],
 ["waist","Waist (in)","number",recent(db.measurements,"waist",40)],
 ["performance","Training performance 1–5","number",3],
 ["recovery","Recovery 1–5","number",3],
 ["adherence","Nutrition consistency %","number",90]
 ])+'<label>Notes (optional)</label><textarea name="notes" rows="2"></textarea><p><button class="gold">Save weekly check-in</button></p></form>'+
 (last.length?'<div class="callout">'+checkinAdvice(last[0],last[1])+'</div>':'<div class="callout">Your first check-in establishes the comparison baseline.</div>')+'</section>'+
 '<div class="tiles"><section><h2>Weight trend</h2>'+svgTrend(db.checkins.length>1?db.checkins:db.measurements,"weight","#f6a849")+'</section><section><h2>Waist trend</h2>'+svgTrend(db.checkins.length>1?db.checkins:db.measurements,"waist","#8ae4c1")+'</section></div>'+
 '<section><h2>Strength snapshots</h2>'+strengthTrend()+'</section>'+
 '<section><h2>Check-in history</h2>'+last.slice(0,12).map(c=>'<div class="entry"><strong>'+esc(c.date)+'</strong> · '+esc(c.weight)+' lb · '+esc(c.waist)+'″ waist · training '+esc(c.performance)+'/5 · recovery '+esc(c.recovery)+'/5</div>').join("")+'</section>'
}
function saveCheckin(e){
 e.preventDefault();let f=new FormData(e.target),x=Object.fromEntries(f.entries());
 if(num(x.weight)<=0||num(x.waist)<=0||num(x.performance)<1||num(x.performance)>5||num(x.recovery)<1||num(x.recovery)>5||num(x.adherence)<0||num(x.adherence)>100){alert("Please check your entered measurements and ratings.");return}
 db.checkins.push(x);save();render()
}
function checkinAdvice(a,b){
 if(!b)return 'Baseline saved. Compare it with your next weekly check-in before deciding on changes.';
 const days=Math.max(1,(new Date(a.date)-new Date(b.date))/86400000),rate=(num(b.weight)-num(a.weight))*7/days;
 if(num(a.adherence)<80)return 'Prioritize logging consistency before adjusting calories or training volume.';
 if(num(a.recovery)<=2||num(a.performance)<=2)return 'Recovery or performance is low. Review sleep, fatigue, and session volume; avoid increasing intensity automatically.';
 if(rate>1.2)return 'Weight is declining rapidly. Review strength, energy, fullness and hydration; consider a smaller deficit.';
 if(rate<0.1&&num(a.waist)>=num(b.waist)&&days>=10)return 'Weight and waist trends appear stalled. Confirm intake and activity before considering a modest adjustment.';
 return 'Progress appears compatible with a gradual transformation. Maintain current approach and keep tracking.'
}


const CLOUD_URL="https://ctcovjeowdueueukdktr.supabase.co";

let cloudClient=null,cloudUser=null,cloudReady=false,cloudBusy=false,cloudTimer=null,cloudQueued=false;

async function initCloud(){
 if(cloudInitStarted)return;cloudInitStarted=true;
 try{
  if(!window.supabase || !window.supabase.createClient){cloudLabel("Cloud library unavailable — local saving only. Check internet connection and reload.");return}
  cloudClient=window.supabase.createClient(CLOUD_URL,CLOUD_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const {data,error}=await cloudClient.auth.getSession();
  if(error)throw error;
  cloudClient.auth.onAuthStateChange((event,session)=>{
    const uid=session?.user?.id||null, old=cloudUser?.id||null;
    if(event==="SIGNED_OUT"){cloudUser=null;cloudReady=false;cloudLabel("Signed out — local device only");if(tab==="settings")render();return}
    if(uid && uid!==old){cloudUser=session.user;cloudReady=false;cloudLabel("Signed in — loading cloud history");setTimeout(()=>cloudInitializeUser(uid),0)}
  });
  if(data?.session?.user){cloudUser=data.session.user;cloudLabel("Signed in — loading cloud history");await cloudInitializeUser(data.session.user.id)}
  else cloudLabel("Not signed in — local device only");
 }catch(e){cloudLabel("Cloud initialization failed: "+String(e.message||e)+". Local saving still works.");}
 if(tab==="settings")render();
}

async function cloudSignOut(){

 if(!confirm("Sign out of cloud backup? Unsynced changes will stay on this device."))return;
 const {error}=await cloudClient.auth.signOut();if(error)alert(error.message);

function cloneCloud(o){return JSON.parse(JSON.stringify(o||{}))}
function cloudFingerprint(item){
 if(item.id!=null)return String(item.id);
 if(item.date && item.name)return String(item.date)+"|"+String(item.name);
 return JSON.stringify(item);
}
function mergeSessions(a,b){
 const newer=(Date.parse(b.updatedAt||"")||0)>=(Date.parse(a.updatedAt||"")||0)?b:a;
 const older=newer===b?a:b,out=cloneCloud(newer);
 const combined=new Map();
 for(const s of older.sets||[])combined.set(String(s.exercise)+"|"+String(s.set??0),cloneCloud(s));
 for(const s of newer.sets||[])combined.set(String(s.exercise)+"|"+String(s.set??0),cloneCloud(s));
 out.sets=[...combined.values()];
 return out;
}
function mergeCloudState(remote,local){
 const a=cloneCloud(remote),b=cloneCloud(local),out=cloneCloud(DEF);
 const bNew=(Number(b._editedAt)||0)>=(Number(a._editedAt)||0);
 Object.assign(out,bNew?a:b);
 out.targets={...DEF.targets,...(bNew?a.targets:b.targets),...(bNew?b.targets:a.targets)};
 out.baseline={...DEF.baseline,...(bNew?a.baseline:b.baseline),...(bNew?b.baseline:a.baseline)};
 out.drafts={...(a.drafts||{})};
 for(const [key,record] of Object.entries(b.drafts||{})){
  const target=out.drafts[key]||{};
  out.drafts[key]={...target,...record};
 }
 for(const key of ["workouts","meals","walks","measurements","checkins"]){
  const records=new Map();
  for(const item of a[key]||[])records.set(cloudFingerprint(item),cloneCloud(item));
  for(const item of b[key]||[]){
   const id=cloudFingerprint(item),previous=records.get(id);
   records.set(id,key==="workouts"&&previous?mergeSessions(previous,item):cloneCloud(item));
  }
  out[key]=[...records.values()];
 }
 out._editedAt=Math.max(Number(a._editedAt)||0,Number(b._editedAt)||0);
 return out;
}
async function cloudInitializeUser(userId){
 if(!cloudClient||!cloudUser||cloudUser.id!==userId||storageIssue)return;
 cloudReady=false;
 try{
  cloudLabel("Loading cloud history and merging local entries…");
  const {data,error}=await cloudClient.from("thor_documents").select("content,revision").eq("owner_id",userId).eq("document_id","app/state").maybeSingle();
  if(error)throw error;
  db=mergeCloudState(data?.content||{},db);
  if(!save(false))throw Error("Local storage is not writable. Export your data.");
  render();
  cloudReady=true;
  await cloudPush();
 }catch(e){cloudReady=false;cloudLabel("Cloud restore failed: "+String(e.message||e)+". Local records remain available.")}
}
function queueCloud(){
 db._editedAt=Date.now();
 if(!cloudReady||!cloudUser)return;
 cloudQueued=true;
 clearTimeout(cloudTimer);
 cloudTimer=setTimeout(()=>{cloudChain=cloudChain.then(()=>cloudPush()).catch(e=>cloudLabel("Cloud error: "+String(e.message||e)));},650);
 cloudLabel("Saved on device — cloud sync pending");
}
async function cloudPush(){
 if(!cloudClient||!cloudUser||!cloudReady)return;
 const uid=cloudUser.id;
 cloudQueued=false;cloudBusy=true;
 cloudLabel("Syncing to cloud…");
 try{
  const {data,error}=await cloudClient.from("thor_documents").select("content,revision").eq("owner_id",uid).eq("document_id","app/state").maybeSingle();
  if(error)throw error;
  const merged=mergeCloudState(data?.content||{},db);
  const {error:writeError}=await cloudClient.from("thor_documents").upsert({
   owner_id:uid,document_id:"app/state",content:cloneCloud(merged),
   revision:(Number(data?.revision)||0)+1,updated_at:new Date().toISOString()
  },{onConflict:"owner_id,document_id"});
  if(writeError)throw writeError;
  db=mergeCloudState(db,merged);
  if(!save(false))throw Error("Could not verify local copy after cloud sync");
  cloudLastSync=new Date().toLocaleString();
  cloudLabel("✓ Synced to cloud — "+cloudLastSync);
  if(tab==="settings")render();
 }catch(e){
  cloudQueued=true;
  cloudLabel("⚠ Not synced: "+String(e.message||e)+". Data remains local; retry Sync now.");
 }finally{
  cloudBusy=false;
 }
}
async function cloudSyncNow(){
 if(!cloudUser)return alert("Sign in first.");
 cloudReady=true;
 cloudChain=cloudChain.then(()=>cloudPush());await cloudChain;
}
window.addEventListener("online",()=>{if(cloudReady&&cloudUser)cloudSyncNow()});

window.addEventListener("error",e=>{document.getElementById("root").insertAdjacentHTML("afterbegin",'<section class="danger">App error: '+esc(e.message)+'</section>')});
render();
initCloud();
